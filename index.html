<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>똥 피하기</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #191a2c;
    --panel: #23243a;
    --line: #3a3c5c;
    --amber: #ffc94d;
    --coral: #ff5d5d;
    --text: #e8e8f0;
    --dim: #8a8ca8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--night);
    color: var(--text);
    font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 16px 12px 32px;
  }
  h1 {
    font-size: 22px;
    letter-spacing: 2px;
    margin-bottom: 4px;
  }
  .sub { color: var(--dim); font-size: 12px; margin-bottom: 14px; }

  .hud {
    width: 100%;
    max-width: 420px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
    font-family: 'Press Start 2P', monospace;
    font-size: 13px;
  }
  .hud .score { color: var(--amber); font-size: 18px; }
  .hud .level { color: var(--dim); transition: color .15s; }
  .hud .level.flash { color: var(--coral); }

  .stage-wrap { position: relative; }
  canvas {
    background: linear-gradient(#14152a 0%, #1d1f38 70%, #262845 100%);
    border: 2px solid var(--line);
    border-radius: 8px;
    display: block;
    touch-action: none;
  }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(20, 21, 42, .88);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 24px;
  }
  .overlay.hidden { display: none; }
  .overlay .big { font-size: 40px; }
  .overlay h2 { font-size: 20px; }
  .overlay .final {
    font-family: 'Press Start 2P', monospace;
    color: var(--amber);
    font-size: 22px;
  }
  .overlay p { color: var(--dim); font-size: 13px; line-height: 1.6; }
  input[type=text] {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--text);
    padding: 10px 12px;
    font-size: 15px;
    width: 200px;
    text-align: center;
  }
  input[type=text]:focus { outline: 2px solid var(--amber); }
  button {
    background: var(--amber);
    color: #1a1a1a;
    border: none;
    border-radius: 6px;
    padding: 12px 26px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  button:active { transform: translateY(1px); }
  button.ghost {
    background: transparent;
    color: var(--dim);
    border: 1px solid var(--line);
  }
  .msg { font-size: 12px; color: var(--dim); min-height: 16px; }
  .msg.err { color: var(--coral); }

  .board {
    width: 100%;
    max-width: 420px;
    margin-top: 20px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px 16px;
  }
  .board h3 {
    font-size: 14px;
    letter-spacing: 1px;
    margin-bottom: 10px;
    color: var(--amber);
  }
  .board ol { list-style: none; }
  .board li {
    display: flex;
    justify-content: space-between;
    padding: 6px 2px;
    font-size: 14px;
    border-bottom: 1px dashed var(--line);
  }
  .board li:last-child { border-bottom: none; }
  .board .rank { color: var(--dim); width: 28px; }
  .board li:nth-child(1) .rank { color: #ffd700; }
  .board li:nth-child(2) .rank { color: #c0c0c0; }
  .board li:nth-child(3) .rank { color: #cd7f32; }
  .board .pts {
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    color: var(--amber);
  }
  .board .empty { color: var(--dim); font-size: 13px; text-align: center; padding: 8px 0; }
</style>
</head>
<body>

<h1>💩 똥 피하기</h1>
<div class="sub">← → 방향키로 피하세요 · 시간이 지날수록 빨라집니다</div>

<div class="hud">
  <span class="score" id="hudScore">0개</span>
  <span class="level" id="hudLevel">LV 1</span>
</div>

<div class="stage-wrap">
  <canvas id="game" width="420" height="600"></canvas>

  <div class="overlay" id="startOverlay">
    <div class="big">💩</div>
    <h2>똥 피하기</h2>
    <p>← → 방향키 (모바일: 화면 좌/우 터치)<br>닿는 순간 게임 오버! · H 키: 히트박스 보기</p>
    <button id="startBtn">게임 시작</button>
  </div>

  <div class="overlay hidden" id="overOverlay">
    <h2>게임 오버</h2>
    <div class="final" id="finalScore">0개</div>
    <input type="text" id="nameInput" maxlength="12" placeholder="닉네임 (12자 이내)">
    <div>
      <button id="submitBtn">랭킹 등록</button>
      <button class="ghost" id="retryBtn">다시 하기</button>
    </div>
    <div class="msg" id="submitMsg"></div>
  </div>
</div>

<div class="board">
  <h3>🏆 RANKING TOP 10</h3>
  <ol id="rankList"><li class="empty">불러오는 중...</li></ol>
</div>

<script>
// ================================================================
// Supabase 설정 — 본인 프로젝트 값으로 교체하세요
// (Settings > API 에서 Project URL과 anon public key 확인)
// ================================================================
const SUPABASE_URL = 'https://fpjgjwazqpfiffnsgume.supabase.co';
const SUPABASE_KEY = 'sb_publishable_I1YgcnYNBOaGy0WwozO2wQ_PGwsLtU5';
const TABLE = 'rankings';

const supabaseReady = SUPABASE_URL.startsWith('https://');
const sbHeaders = {
  apikey: SUPABASE_ANON_KEY,
  Authorization: 'Bearer ' + SUPABASE_ANON_KEY,
  'Content-Type': 'application/json'
};

// ---------------- 게임 상태 ----------------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const PLAYER = { w: 3, h: 6, y: H - 40, speed: 320 }; // px/s
let player, poops, elapsed, running, lastTime, spawnTimer, keys, dodged;
let showHitbox = false; // H 키로 토글

// 💩 이모지의 실제 렌더링 픽셀 경계를 런타임에 측정
// (플랫폼마다 이모지 여백이 달라서, 알파 채널을 스캔해 정확한 경계를 구함)
function measureGlyph(glyph) {
  const s = 100, c = document.createElement('canvas');
  c.width = c.height = s * 2;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.font = s + 'px serif';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillText(glyph, s, s);
  const d = g.getImageData(0, 0, s * 2, s * 2).data;
  let minX = s * 2, minY = s * 2, maxX = -1, maxY = -1;
  for (let y = 0; y < s * 2; y++) {
    for (let x = 0; x < s * 2; x++) {
      if (d[(y * s * 2 + x) * 4 + 3] > 16) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX < 0) return { dx: -0.5, dy: -0.5, w: 1, h: 1 }; // 측정 실패 시 폰트 박스 전체
  // 그리기 기준점(중앙) 대비 비율로 저장 → 어떤 크기로 그려도 경계 환산 가능
  return { dx: (minX - s) / s, dy: (minY - s) / s, w: (maxX - minX + 1) / s, h: (maxY - minY + 1) / s };
}
const POOP_GLYPH = measureGlyph('💩');

// 똥 히트박스 = 화면에 보이는 글리프의 실제 경계
function poopBounds(p) {
  const cx = p.x + p.size / 2, cy = p.y + p.size / 2;
  return {
    x: cx + POOP_GLYPH.dx * p.size,
    y: cy + POOP_GLYPH.dy * p.size,
    w: POOP_GLYPH.w * p.size,
    h: POOP_GLYPH.h * p.size
  };
}

// 플레이어 지오메트리 — 그리기와 히트박스가 같은 좌표를 공유
function playerGeom() {
  const cx = player.x + PLAYER.w / 2;
  const y = PLAYER.y;
  const run = running ? Math.sin(elapsed * 10) : 0; // 달리기 스윙
  return {
    head:  { x: cx, y: y + 9, r: 7 },
    torso: { x: cx - 7, y: y + 15, w: 14, h: 18, r: 7 },
    limbs: [
      { x1: cx - 6, y1: y + 19, x2: cx - 6 - run * 5, y2: y + 27, lw: 4 }, // 왼팔
      { x1: cx + 6, y1: y + 19, x2: cx + 6 + run * 5, y2: y + 27, lw: 4 }, // 오른팔
      { x1: cx - 3, y1: y + 32, x2: cx - 3 + run * 6, y2: y + 46, lw: 5 }, // 왼다리
      { x1: cx + 3, y1: y + 32, x2: cx + 3 - run * 6, y2: y + 46, lw: 5 }  // 오른다리
    ]
  };
}

// 플레이어 히트박스 = 매 프레임 실제 그려지는 부위(팔다리 스윙 포함)의 경계
function playerBounds() {
  const g = playerGeom();
  let minX = Math.min(g.head.x - g.head.r, g.torso.x);
  let maxX = Math.max(g.head.x + g.head.r, g.torso.x + g.torso.w);
  let minY = g.head.y - g.head.r;
  let maxY = g.torso.y + g.torso.h;
  for (const l of g.limbs) {
    const h = l.lw / 2; // lineCap round → 끝점이 반지름만큼 확장됨
    minX = Math.min(minX, l.x1 - h, l.x2 - h);
    maxX = Math.max(maxX, l.x1 + h, l.x2 + h);
    minY = Math.min(minY, l.y1 - h, l.y2 - h);
    maxY = Math.max(maxY, l.y1 + h, l.y2 + h);
  }
  return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
}

// 난이도 곡선: 시간(초) 기반
function fallSpeed(t)     { return 160 + t * 14; }          // 낙하 속도 px/s
function spawnInterval(t) { return Math.max(0.12, 0.3 - t * 0.006); } // 생성 간격 s
function levelOf(t)       { return 1 + Math.floor(t / 10); }

function reset() {
  player = { x: W / 2 - PLAYER.w / 2 };
  poops = [];
  dodged = 0;
  elapsed = 0;
  spawnTimer = 0;
  keys = { left: false, right: false };
}

function spawnPoop() {
  const size = 15 + Math.random() * 8; // 기존의 절반
  poops.push({
    x: Math.random() * (W - size),
    y: -size,
    size,
    vy: fallSpeed(elapsed) * (0.85 + Math.random() * 0.3)
  });
}

// ---------------- 루프 ----------------
function update(dt) {
  elapsed += dt;

  if (keys.left)  player.x -= PLAYER.speed * dt;
  if (keys.right) player.x += PLAYER.speed * dt;
  player.x = Math.max(0, Math.min(W - PLAYER.w, player.x));

  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnPoop();
    spawnTimer = spawnInterval(elapsed);
  }

  for (const p of poops) {
    p.y += p.vy * dt;
  }
  poops = poops.filter(p =>{
    if (p.y < H + p.size) return true;
    dodged++
    return false;
  });

  // 충돌 판정 — 보이는 것과 동일한 경계끼리 AABB 교차
  const pb = playerBounds();
  for (const p of poops) {
    const b = poopBounds(p);
    if (pb.x < b.x + b.w && pb.x + pb.w > b.x &&
        pb.y < b.y + b.h && pb.y + pb.h > b.y) {
      gameOver();
      return;
    }
  }

  // HUD
  document.getElementById('hudScore').textContent = dodged + '개';
  const lv = levelOf(elapsed);
  const lvEl = document.getElementById('hudLevel');
  if (lvEl.textContent !== 'LV ' + lv) {
    lvEl.textContent = 'LV ' + lv;
    lvEl.classList.add('flash');
    setTimeout(() => lvEl.classList.remove('flash'), 400);
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // 바닥선
  ctx.strokeStyle = '#3a3c5c';
  ctx.beginPath();
  ctx.moveTo(0, H - 12);
  ctx.lineTo(W, H - 12);
  ctx.stroke();

  // 플레이어 (벡터 캐릭터 — playerGeom과 좌표 공유)
  const g = playerGeom();
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#e8e8f0';
  for (const l of g.limbs) {
    ctx.lineWidth = l.lw;
    ctx.beginPath();
    ctx.moveTo(l.x1, l.y1);
    ctx.lineTo(l.x2, l.y2);
    ctx.stroke();
  }
  ctx.fillStyle = '#ffc94d';
  ctx.beginPath();
  ctx.roundRect(g.torso.x, g.torso.y, g.torso.w, g.torso.h, g.torso.r);
  ctx.fill();
  ctx.fillStyle = '#e8e8f0';
  ctx.beginPath();
  ctx.arc(g.head.x, g.head.y, g.head.r, 0, Math.PI * 2);
  ctx.fill();

  // 똥 (회전 없음 — 회전하면 히트박스와 어긋남)
  for (const p of poops) {
    ctx.font = p.size + 'px serif';
    ctx.fillText('💩', p.x + p.size / 2, p.y + p.size / 2);
  }

  // 히트박스 디버그 (H 키)
  if (showHitbox) {
    ctx.lineWidth = 1;
    ctx.strokeStyle = '#ff5d5d';
    const pb = playerBounds();
    ctx.strokeRect(pb.x, pb.y, pb.w, pb.h);
    for (const p of poops) {
      const b = poopBounds(p);
      ctx.strokeRect(b.x, b.y, b.w, b.h);
    }
  }
}

function loop(ts) {
  if (!running) return;
  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;
  update(dt);
  if (running) {
    draw();
    requestAnimationFrame(loop);
  }
}

function startGame() {
  reset();
  document.getElementById('startOverlay').classList.add('hidden');
  document.getElementById('overOverlay').classList.add('hidden');
  running = true;
  lastTime = performance.now();
  requestAnimationFrame(loop);
}

function gameOver() {
  running = false;
  draw();
  document.getElementById('finalScore').textContent = dodged + '개';
  document.getElementById('submitMsg').textContent = supabaseReady ? '' : 'Supabase 미설정 — 랭킹 등록 불가';
  document.getElementById('submitBtn').disabled = !supabaseReady;
  document.getElementById('overOverlay').classList.remove('hidden');
  document.getElementById('nameInput').focus();
}

// ---------------- 입력 ----------------
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')  { keys.left = true;  e.preventDefault(); }
  if (e.key === 'ArrowRight') { keys.right = true; e.preventDefault(); }
  if (e.key === 'h' || e.key === 'H' || e.key === 'ㅗ') showHitbox = !showHitbox;
});
document.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft')  keys.left = false;
  if (e.key === 'ArrowRight') keys.right = false;
});
// 모바일: 캔버스 좌/우 절반 터치
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const x = e.touches[0].clientX - canvas.getBoundingClientRect().left;
  if (x < W / 2) keys.left = true; else keys.right = true;
});
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  keys.left = keys.right = false;
});

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('retryBtn').addEventListener('click', startGame);
reset();

// ---------------- Supabase 랭킹 ----------------
async function fetchRanking() {
  const list = document.getElementById('rankList');
  if (!supabaseReady) {
    list.innerHTML = '<li class="empty">Supabase 설정 후 랭킹이 표시됩니다</li>';
    return;
  }
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/${TABLE}?select=name,score&order=score.desc&limit=10`,
      { headers: sbHeaders }
    );
    if (!res.ok) throw new Error(res.status);
    const rows = await res.json();
    if (rows.length === 0) {
      list.innerHTML = '<li class="empty">아직 기록이 없습니다 — 첫 주자가 되어보세요!</li>';
      return;
    }
    list.innerHTML = rows.map((r, i) =>
      `<li><span><span class="rank">${i + 1}</span>${escapeHtml(r.name)}</span>` +
      `<span class="pts">${r.score}</span></li>`
    ).join('');
  } catch (err) {
    list.innerHTML = '<li class="empty">랭킹 로딩 실패 (' + err.message + ')</li>';
  }
}

async function submitScore() {
  const name = document.getElementById('nameInput').value.trim();
  const msg = document.getElementById('submitMsg');
  msg.classList.remove('err');
  if (!name) {
    msg.textContent = '닉네임을 입력하세요';
    msg.classList.add('err');
    return;
  }
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  msg.textContent = '등록 중...';
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}`, {
      method: 'POST',
      headers: { ...sbHeaders, Prefer: 'return=minimal' },
      body: JSON.stringify({ name, score: dodged })
    });
    if (!res.ok) throw new Error(res.status);
    msg.textContent = '등록 완료! 🎉';
    fetchRanking();
  } catch (err) {
    msg.textContent = '등록 실패 (' + err.message + ')';
    msg.classList.add('err');
    btn.disabled = false;
  }
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

document.getElementById('submitBtn').addEventListener('click', submitScore);
document.getElementById('nameInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') submitScore();
});

fetchRanking();
</script>
</body>
</html>
